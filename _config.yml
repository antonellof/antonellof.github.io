# Site settings
title: Antonello Fratepietro
email: antonello.f at gmail dot com
description: >-
  Cloud engineer and developer passionate about building scalable Cloud and AI infrastructure.
  Writings on software architecture, distributed systems, and engineering leadership.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.fratepietro.com" # the base hostname & protocol for your site

# Author information
author:
  name: Antonello Fratepietro
  email: antonello.f at gmail dot com

# SEO settings
lang: en_US
timezone: Europe/Rome

# Social profiles for SEO
twitter:
  username: hack_the_cloud
  card: summary_large_image

social:
  name: Antonello Fratepietro
  links:
    - https://github.com/antonellof
    - https://x.com/hack_the_cloud
    - https://www.fratepietro.com

# Google Analytics
google_analytics: G-391KR8TPR1

# Google Search Console verification (add your verification code when ready)
# google_site_verification: "your-verification-code-here"

# Default SEO image for social sharing
# logo: /assets/images/logo.png       # asset not present; re-enable once committed
# social_image: /assets/images/social-card.png

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Minima settings
minima:
  skin: auto
  
  # Show excerpts on the homepage
  show_excerpts: true
  
  # Date format
  date_format: "%b %-d, %Y"
  
  # Navigation pages
  # `index.md` is the site root and is already linked by the site title in
  # the header, so listing it again creates a redundant "Home" entry.
  nav_pages:
    - about.md
  
  # Social links
  social_links:
    - title: GitHub
      icon: github
      url: "https://github.com/antonellof"
    - title: X (formerly Twitter)
      icon: x-twitter
      url: "https://x.com/hack_the_cloud"
    - title: Website
      icon: globe
      url: "https://www.fratepietro.com"

# Exclude from processing
exclude:
  - backup/
  - temp-minima/
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - README.md

# Permalink structure
permalink: /:year/:title/
